name: install oras
description: >-
  Install a checksum-verified oras release, for the tests that drive a real oras against an OCI
  image layout. Those tests fail rather than skip in CI when oras is missing, so every job that
  runs them installs it through here and hands the path output to them as ORAS_BIN.

outputs:
  path:
    description: Absolute path of the installed oras binary.
    value: ${{ steps.install.outputs.path }}

runs:
  using: composite
  steps:
    # The expected digests are pinned here, beside the version, rather than read from the
    # release's own `checksums.txt`: a file downloaded from the same place as the archive can only
    # catch a truncated download, never a replaced one. A version bump therefore fails this step
    # until both digests are updated from the new release's `oras_<version>_checksums.txt` — which
    # is the point: the bump becomes a reviewed change to the bytes, not just to a number.
    - name: install oras
      id: install
      shell: bash
      env:
        # renovate: datasource=github-releases depName=oras-project/oras extractVersion=^v(?<version>.*)$
        ORAS_VERSION: 1.3.5
        ORAS_SHA256_LINUX_AMD64: f48a73ea6d026a862c3919fc773da9a8c86fc259c2c737d5baed3b8b9614ad22
        ORAS_SHA256_LINUX_ARM64: d5d4e5afd5c0781c93eda5ea1976e654e1fdee202c1ddaeaf5f91a8c4fd67d46
      run: |
        set -euo pipefail
        case "${RUNNER_OS}/${RUNNER_ARCH}" in
          Linux/X64) arch=amd64 expected="${ORAS_SHA256_LINUX_AMD64}" ;;
          Linux/ARM64) arch=arm64 expected="${ORAS_SHA256_LINUX_ARM64}" ;;
          *) echo "::error::install-oras pins no digest for ${RUNNER_OS}/${RUNNER_ARCH}" >&2; exit 1 ;;
        esac
        base="https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}"
        archive="oras_${ORAS_VERSION}_linux_${arch}.tar.gz"
        mkdir -p "$RUNNER_TEMP/oras"
        cd "$RUNNER_TEMP/oras"
        curl -fsSLO "$base/$archive"
        echo "${expected}  ${archive}" | sha256sum --check --strict
        tar -xzf "$archive" oras
        echo "path=$RUNNER_TEMP/oras/oras" >> "$GITHUB_OUTPUT"
