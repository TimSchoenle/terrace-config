name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing granted by default: each job requests only the scopes it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Path filtering lives in its own job rather than a top-level `on.push.paths` filter: this
  # workflow's Rust jobs still have to run on every push regardless of what changed, since they
  # are the required check branch protection names. A workflow-level path filter would just skip
  # the whole run, taking the required Rust checks with it.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      java: ${{ steps.filter.outputs.java }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            java:
              - 'java/**'

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check
        working-directory: rust

  clippy:
    name: clippy (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Every feature set is linted separately. `--all-features` alone would not catch a
        # `reload`-only build referring to a `loader`-only item.
        features:
          - "--all-features"
          - "--no-default-features --features loader"
          - "--no-default-features --features schema"
          - "--no-default-features --features explain"
          - "--no-default-features --features testing"
          - "--no-default-features --features reload"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: TimSchoenle/actions/actions/rust/clippy@90667cd95bd8ee306fbd54412c2e082448fb5a40
        with:
          source_directory: rust
          clippy_arguments: ${{ matrix.features }} --all-targets

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: TimSchoenle/actions/actions/rust/test@90667cd95bd8ee306fbd54412c2e082448fb5a40
        with:
          source_directory: rust
          # `--workspace`, not just `--all-features`: the derive's parser is tested in
          # `macros/`, and without this cargo tests only the root package and reports green
          # while running none of them.
          #
          # `--all-features` is also what compiles the integration tests at all: they run inside
          # a `terrace_config::testing` jail, which is the `testing` feature, and a test file
          # whose `cfg` is not satisfied is silently empty rather than a failure.
          test_arguments: --workspace --all-features

  # A build of each feature set on its own, with no dev-dependencies in the graph. This is the
  # job that catches a feature only unified in by a dev-dependency — `tokio/macros` was exactly
  # that, and `cargo test --all-features` passed while `cargo doc` did not.
  features:
    name: features (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - "--no-default-features --features loader"
          - "--no-default-features --features schema"
          - "--no-default-features --features explain"
          - "--no-default-features --features testing"
          - "--no-default-features --features reload"
          - "--all-features"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: TimSchoenle/actions/actions/rust/cargo-check@90667cd95bd8ee306fbd54412c2e082448fb5a40
        with:
          source_directory: rust
          check_arguments: --lib ${{ matrix.features }}

  doc:
    name: doc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      # Once per feature set: the crate documentation is itself feature-gated, so a broken
      # intra-doc link can hide in a set `--all-features` never renders.
      - run: cargo doc --all-features --no-deps
        working-directory: rust
      - run: cargo doc --no-default-features --features loader --no-deps
        working-directory: rust
      - run: cargo doc --no-default-features --features schema --no-deps
        working-directory: rust
      - run: cargo doc --no-default-features --features explain --no-deps
        working-directory: rust
      - run: cargo doc --no-default-features --features testing --no-deps
        working-directory: rust
      - run: cargo doc --no-default-features --features reload --no-deps
        working-directory: rust
      # The only step that runs the doctests at all: `test` delegates to `cargo nextest`, which
      # does not run them by design. It is also the job that sets `RUSTDOCFLAGS`, so a doctest
      # carrying a rustdoc warning fails here.
      - run: cargo test --doc --all-features
        working-directory: rust

  # `fuzz/` is a workspace of its own on a nightly toolchain, so none of the jobs above touch it.
  #
  # Two things run here. The replay suite is the gate: it re-runs every committed seed and a
  # deterministic sweep through the oracles on a plain `cargo test`, no sanitizer involved, and a
  # reproducer promoted into `corpus/` keeps being checked forever. The short campaign after it is
  # a smoke test that the libFuzzer plumbing still links — not a hunt; a real hunt is a human
  # running `cargo fuzz run` for hours.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: nightly
          components: clippy
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-fuzz
      - name: Replay the corpus
        working-directory: rust/fuzz
        env:
          # Larger than the local default: this runs once per push, not on every `cargo test`.
          TERRACE_FUZZ_ITERATIONS: "5000"
        run: cargo test
      - name: Lint the oracles
        working-directory: rust/fuzz
        run: cargo clippy --all-targets
      # The `doc` job above cannot reach here: `fuzz/` is a workspace of its own. Without this
      # step its `[lints.rustdoc]` table is declared and enforced by nothing, and a broken
      # intra-doc link renders as literal text nobody sees.
      - name: Document the oracles
        working-directory: rust/fuzz
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --lib --no-deps
      - name: Short campaign
        working-directory: rust
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          for target in env_load secrets_dir toml_layers schema explain; do
            cargo fuzz run --target "$host" "$target" \
              "fuzz/corpus/$target" "fuzz/seeds/$target" \
              -- -dict=fuzz/dictionaries/config.dict -max_total_time=60
          done

  # The crate is distributed as a git dependency with no `path` component, relying on Cargo's
  # search of the whole repository for a package named `terrace-config`. This is the only check
  # that the published install snippet — a bare `{ git = "..." }` with no `path` key — actually
  # resolves now that the package lives under `rust/`. Keep it permanently; it is cheap and it is
  # the one thing that must never regress silently.
  consumer-smoke-test:
    name: consumer smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - name: Build a throwaway crate depending on this checkout by git URL
        run: |
          set -euo pipefail
          cargo new --bin /tmp/consumer-smoke-test
          cd /tmp/consumer-smoke-test
          cargo add terrace-config --git "file://${GITHUB_WORKSPACE}"
          cargo build

  # Gated on the `changes` job: a pure-Rust commit never has anything for Gradle to build, and
  # skipping means this reports as a green "skipped" rather than a required check nobody who
  # touched only `rust/` can satisfy.
  java:
    name: java
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b # v4.6.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4.3.1
        with:
          build-root-directory: java
      - run: ./gradlew clean test --console=plain
        working-directory: java

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: rust/Cargo.toml
      # `cli/` is a second workspace and a second dependency tree — an archive reader, a hash, a
      # YAML reader, a schema validator — none of which this action would see from the root.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: cli/Cargo.toml

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Read from the manifest rather than repeated inline, so the pin cannot drift from the
      # `rust-version` it is meant to verify.
      - id: msrv
        run: echo "version=$(grep -m1 '^rust-version' rust/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo check --workspace --all-features --all-targets
        working-directory: rust
      # Declared in `cli/Cargo.toml` as well, and checked by nothing until now: it is the version
      # a consuming repository has to be able to build the toolchain with.
      - run: cargo check --workspace --all-features --all-targets
        working-directory: cli

  # The shared toolchain, which is a separate workspace and so is invisible to every job above:
  # `cargo fmt --all`, `--workspace` and `cargo deny` all stop at the root manifest's members.
  #
  # Three things are checked here that are checked nowhere else:
  #
  #   - `--no-default-features`, which is the mechanical proof that no consumer-side concept has
  #     leaked down into the document model or the renderers. That half is what a language's build
  #     links, and it must never learn what a chart is.
  #   - the renderings against `spec/v1/conformance/*/rendered/`, which is the whole claim the
  #     shared toolchain rests on: a rendering is a pure function of the published document, so it
  #     can be written once instead of once per producer.
  #   - that it does **not** depend on `terrace-config`. A renderer reaching for one producer's
  #     types would be that producer's renderer wearing a shared name, and nothing else in this
  #     repository would notice that edge appearing.
  cli:
    name: cli
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt, clippy
          workspaces: cli
      - name: fmt
        run: cargo fmt --check
        working-directory: cli
      - name: clippy
        run: cargo clippy --all-targets
        working-directory: cli
      - name: clippy (no default features)
        run: cargo clippy --all-targets --no-default-features
        working-directory: cli
      # The stack is `cli` -> `helm` -> `k8s` -> the core, with `oci` beside `helm`. The two ends
      # above compile every module and none of the middle combinations, so a `helm`-only build
      # referring to an `oci`-only item — which is the whole reason the registry half is split out
      # — would reach a consumer that took the gates without the archive reader.
      - name: clippy (each rung of the stack)
        working-directory: cli
        run: |
          for features in k8s helm oci; do
            echo "::group::--features $features"
            cargo clippy --all-targets --no-default-features --features "$features"
            echo "::endgroup::"
          done
      - name: test
        run: cargo test
        working-directory: cli
      # `cli/` is a workspace of its own, so the `doc`, `deny` and `msrv` jobs above run at the
      # repository root and never reach it. Without these three steps its `[lints.rustdoc]` table
      # is enforced by nothing, its dependencies are licence- and advisory-checked by nothing, and
      # its own `rust-version` is checked by nothing — the same gap the fuzz job records for
      # `fuzz/`, one workspace over.
      - name: doc
        working-directory: cli
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc --all-features --no-deps
          cargo doc --no-default-features --no-deps
      # The fuzz crate is a third workspace, and its oracles are the only thing checking that a
      # rendering keeps its own promise on documents nobody wrote: that the TOML file parses, that
      # a Markdown row has its header's column count, that a placeholder's shape comes from
      # `constraint` rather than from `ty`. It replays without libFuzzer on purpose — an oracle
      # that only runs under a nightly sanitizer is an oracle nobody checks.
      - name: fuzz oracles
        run: cargo test
        working-directory: cli/fuzz
      - name: fuzz clippy
        run: cargo clippy --all-targets
        working-directory: cli/fuzz
      # `^terrace-config( |$)` and not a bare grep: the checkout path contains the string, so a
      # looser pattern reports a dependency that is not there and this gate stops meaning anything.
      - name: it depends on no implementation
        working-directory: cli
        run: |
          if cargo tree --prefix none | grep -qE '^terrace-config( |$)'; then
            echo "::error::cli/ has grown a dependency on the Rust implementation."
            echo "Every rendering here is a pure function of the published document, which is"
            echo "what makes it a renderer for every producer rather than for one."
            cargo tree --invert terrace-config
            exit 1
          fi
          echo "no dependency on any implementation"

  # The single required check. It fails if any job failed and passes when jobs were skipped, so
  # branch protection needs one entry that cannot silently stop existing.
  ci:
    name: ci
    if: always()
    needs:
      [
        changes,
        fmt,
        clippy,
        test,
        features,
        doc,
        fuzz,
        deny,
        msrv,
        cli,
        consumer-smoke-test,
        java,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "all gates green"
