name: docs

# Four READMEs are generated from `.github/templates/`: `README.md`, `rust/README.md`,
# `java/README.md` and `cli/README.md`. On a pull request the `render` job in generate.yaml renders
# them and generate-commit.yaml commits the result, so nothing a README quotes about itself is
# edited by hand.
#
# This workflow is the other direction. On every event it renders in `check` mode, writing nothing
# and failing if a committed README is stale. Without it, editing a README directly would appear to
# work right up until the next pull request silently reverted it.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: readme
    # Runs on every event. On a same-repository pull request whose READMEs are stale it fails on
    # that commit; generate-commit.yaml then pushes the rendered files with the App token, which
    # starts a new run where it passes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Collect the Rust payload
        id: rust_variables
        uses: TimSchoenle/actions/actions/common/readme-variables@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-common-readme-variables-v2.1.3
        with:
          branch: ${{ github.event.repository.default_branch }}
          manifest: rust/Cargo.toml
          docs-dir: rust/docs

      - name: Collect the Java payload
        id: java_variables
        uses: TimSchoenle/actions/actions/common/readme-variables@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-common-readme-variables-v2.1.3
        with:
          branch: ${{ github.event.repository.default_branch }}
          manifest: java/gradle.properties
          docs-dir: java/docs
          tag-prefix: terrace-config-java-v

      - name: Generate the cli image series
        id: cli_config
        run: |
          set -euo pipefail
          json="$(bash .github/scripts/readme-variables.sh cli/Cargo.toml)"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      - name: Collect the cli payload
        id: cli_variables
        uses: TimSchoenle/actions/actions/common/readme-variables@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-common-readme-variables-v2.1.3
        with:
          branch: ${{ github.event.repository.default_branch }}
          manifest: cli/Cargo.toml
          docs-dir: cli/docs
          tag-prefix: terrace-contract-v
          extra: ${{ steps.cli_config.outputs.json }}

      # Each step writes nothing and fails with the first differing line when its README is stale.
      - name: Verify rust/README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-common-render-template-v3.0.3
        with:
          template: .github/templates/README.md.hbs
          output: rust/README.md
          variables: ${{ steps.rust_variables.outputs.variables }}
          check: true

      - name: Verify java/README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-common-render-template-v3.0.3
        with:
          template: .github/templates/java-README.md.hbs
          output: java/README.md
          variables: ${{ steps.java_variables.outputs.variables }}
          check: true

      - name: Verify cli/README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-common-render-template-v3.0.3
        with:
          template: .github/templates/cli-README.md.hbs
          output: cli/README.md
          variables: ${{ steps.cli_variables.outputs.variables }}
          check: true

      - name: Verify README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-common-render-template-v3.0.3
        with:
          template: .github/templates/root-README.md.hbs
          output: README.md
          variables: ${{ steps.rust_variables.outputs.variables }}
          check: true
