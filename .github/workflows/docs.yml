name: docs

# `README.md` is generated from `.github/templates/README.md.hbs`. This workflow is what makes
# that claim true in both directions.
#
# On a pull request it renders the template and commits the result to the branch, so nothing the
# README quotes about itself is edited by hand: the tag its install snippets pin, the MSRV its
# badge shows, the licence its last section names, and the table of everything under `docs/`.
# The case that matters is the release-please pull request: that
# commit is the one which changes `version` in `Cargo.toml`, so it is also the one where the
# README would otherwise start advertising the previous tag. Rendering here means the released
# README already points at the tag the merge is about to create.
#
# Everywhere it cannot commit — a push to `main`, a pull request from a fork — it renders in
# `check` mode instead, writing nothing and failing if the committed `README.md` is stale.
# Without it, editing `README.md` directly would appear to work right up until the next pull
# request silently reverted it.

on:
  pull_request:
  push:
    branches: [main]

# Shared with update-files.yaml, not scoped to this workflow: both commit to the pull request
# branch, and the API call that makes a verified commit rejects one whose parent has moved. Two
# renders of the same branch racing would leave one of them failing for no reason a reader could
# act on, so they queue instead. `cancel-in-progress: false` for the same reason — a cancelled
# run here means a branch left holding a half-generated file.
concurrency:
  group: branch-writes-${{ github.event.pull_request.head.repo.full_name || github.repository }}:${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  # `render` and `render-commit` are two halves, and the split is the security boundary of this
  # workflow. `render` runs the pull request's own script and templates, so it holds no secret
  # and a read-only `GITHUB_TOKEN`, and hands on only a patch artifact. `render-commit` holds the
  # maintenance App's private key and the write token minted from it, runs nothing from the
  # checkout, and `allowed_paths` refuses any path other than the three READMEs.
  render:
    name: render
    # A fork's branch is not in this repository, so there would be nothing to commit to.
    # `check` below picks those pull requests up instead.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The head of the branch, not the merge commit: the render has to read the `Cargo.toml`
      # the pull request proposes, and the patch has to apply on top of the commit the branch
      # points at, which is the one `commit-patch` checks it against.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Invoked through `bash` rather than executed: the repository is authored on Windows, where
      # git does not record the executable bit.
      - name: Generate the configuration payload
        id: config
        run: |
          set -euo pipefail
          json="$(bash .github/scripts/readme-variables.sh)"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      # `branch` is the default branch rather than the action's `github.ref_name` default, which
      # on a pull_request event is `<number>/merge`. Left alone, the badge URL rendered here and
      # the one rendered by `check` on `main` differ, and the gate fails on every merge for a
      # reason absent from the diff.
      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-readme-variables-v1.2.9
        with:
          branch: ${{ github.event.repository.default_branch }}
          manifest: rust/Cargo.toml
          docs-dir: rust/docs
          extra: ${{ steps.config.outputs.json }}

      - name: Render the README
        id: readme
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/README.md.hbs
          output: rust/README.md
          variables: ${{ steps.variables.outputs.variables }}

      - name: Render the Java README
        id: java_readme
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/java-README.md.hbs
          output: java/README.md
          variables: ${{ steps.variables.outputs.variables }}

      # The repository's front door, rendered from the same payload. It quotes none of the
      # crate-specific fields (MSRV, the docs table), so the manifest/docs-directory inputs above
      # only matter to the crate render — this one only reads `repo`.
      - name: Render the root README
        id: root_readme
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/root-README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}

      - name: Create Patch
        id: patch
        uses: TimSchoenle/actions/actions/common/create-patch@bbc2c5e2a0f9345cb2e84946846736f047a6eae3 # tag=actions-common-create-patch-v1.1.0
        with:
          artifact_name: docs-readmes
          paths: 'README.md rust/README.md java/README.md'

      - name: Summarise
        env:
          CHANGED: ${{ steps.readme.outputs.changed }}
          JAVA_CHANGED: ${{ steps.java_readme.outputs.changed }}
          ROOT_CHANGED: ${{ steps.root_readme.outputs.changed }}
        run: |
          for entry in "rust/README.md:${CHANGED}" "java/README.md:${JAVA_CHANGED}" "README.md:${ROOT_CHANGED}"; do
            if [ "${entry#*:}" = "true" ]; then
              echo "${entry%%:*} re-rendered; render-commit commits it." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "${entry%%:*} already matched its template." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  render-commit:
    name: render-commit
    needs: render
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.render.outputs.has_changes == 'true'
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch the commit the patch applies to; the write uses the App token
    steps:
      # Checkout, the token mint, the artifact download and the GraphQL commit, and nothing else.
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # Only git's objects are needed: the patch is applied on top of this commit's tree. Nothing
      # in this checkout is executed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # An App installation token, so the commit is verified and — unlike one made with
      # `GITHUB_TOKEN` — re-triggers the checks on the branch it lands on.
      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write

      # The artifact name is a literal, not the render job's output: that job ran the pull
      # request's code.
      - name: Commit the READMEs
        id: commit
        uses: TimSchoenle/actions/actions/common/commit-patch@bbc2c5e2a0f9345cb2e84946846736f047a6eae3 # tag=actions-common-commit-patch-v1.1.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          artifact_name: docs-readmes
          # The three files the templates render to. Any other path fails this job.
          allowed_paths: 'README.md rust/README.md java/README.md'
          commit_message: 'docs: render READMEs from templates'

      - name: Summarise
        env:
          OUTCOME: ${{ steps.commit.outputs.outcome }}
          COMMIT_URL: ${{ steps.commit.outputs.commit_url }}
        run: |
          if [ "${OUTCOME}" = "committed" ]; then
            echo "READMEs re-rendered: ${COMMIT_URL}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing committed (${OUTCOME})." >> "$GITHUB_STEP_SUMMARY"
          fi

  check:
    name: readme
    # The complement of `render`: it covers the pushes to `main` that no pull request rendered,
    # and the fork pull requests that could not be committed to. Between the two conditions every
    # event this workflow sees is handled by exactly one job.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Generate the configuration payload
        id: config
        run: |
          set -euo pipefail
          json="$(bash .github/scripts/readme-variables.sh)"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-readme-variables-v1.2.9
        with:
          branch: ${{ github.event.repository.default_branch }}
          manifest: rust/Cargo.toml
          docs-dir: rust/docs
          extra: ${{ steps.config.outputs.json }}

      # Writes nothing; fails with the first differing line when README.md is stale.
      - name: Verify rust/README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/README.md.hbs
          output: rust/README.md
          variables: ${{ steps.variables.outputs.variables }}
          check: true

      - name: Verify java/README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/java-README.md.hbs
          output: java/README.md
          variables: ${{ steps.variables.outputs.variables }}
          check: true

      - name: Verify README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/root-README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}
          check: true
