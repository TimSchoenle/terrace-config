name: release-cli

# Publishing `terrace-contract`: §9 of `docs/contract-cli-plan.md`, as a pipeline.
#
# The crate is `publish = false` and stays so. What a consuming build actually wants is a binary or
# an image — no toolchain, no compile, no platform detection — so the artefacts are the release, and
# crates.io would only be a third name for the same thing.
#
# Two channels, from one set of bytes:
#
#   9.2  four binaries, `SHA256SUMS` beside them, every file signed keylessly
#   9.1  a multi-architecture image at `ghcr.io/<owner>/terrace-contract`, signed the same way
#
# The image is built *from the binaries this workflow already produced* rather than compiled again
# inside it. A `cargo build` per architecture under emulation costs an hour where a `COPY` costs a
# second — and, more importantly, the bytes in the image are then the same bytes the release
# attached and cosign signed, where a second build would produce a second artefact nobody verified
# against the first.
#
# **Signing matters more than usual here.** The consuming repository already refuses a *contract*
# whose signer identity does not match the one it pins; a tool that validates signed documents,
# arriving unsigned, is a hole in the same argument.
#
# Called by `release-please.yaml` once it has cut the `cli` package's tag, and callable by hand
# against a tag that already exists. It publishes what that tag names and never decides what to
# release — the version, the changelog and the tag are release-please's, and a publisher that also
# chose a version would be a second place the version lives.

on:
  # Called by `release-please.yaml` in the same run that cut the tag, rather than triggered by the
  # tag landing. The two differ in one way that matters: a called workflow is part of the release
  # run, so the release either happened or it did not — where a separate tag-triggered run can
  # succeed at tagging and fail at publishing, leaving a tag nobody can install.
  workflow_call:
    inputs:
      tag:
        description: The tag to publish, e.g. terrace-contract-v0.1.0
        required: true
        type: string

  # And by hand, against a tag that already exists: a publish that failed halfway — a registry
  # outage, an expired token — is re-run rather than re-tagged. Dispatched from `main` only; the
  # `resolve` job below refuses any other ref.
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to publish, e.g. terrace-contract-v0.1.0
        required: true
        type: string

# A release must never be cancelled halfway: the assets, the image and the two signatures are
# separate API calls, and a cancellation between them leaves a state no rerun can infer. Named for
# this workflow rather than `github.workflow`, which for a called workflow is the *caller's* name —
# so the group would otherwise be the release run's own, and a publish would cancel nothing but
# would sit behind it.
concurrency:
  group: release-cli-${{ inputs.tag }}
  cancel-in-progress: false

permissions: {}

env:
  # `terrace-contract-v0.1.0` is the tag; `0.1.0` is what the image is tagged with and what a
  # consumer pins. Derived once here rather than in four places that could disagree. Every job
  # that reads it runs after `resolve`, which has refused any value that is not exactly that shape.
  TAG: ${{ inputs.tag }}

jobs:
  # ----------------------------------------------------------------------------------------------
  # What is being published
  # ----------------------------------------------------------------------------------------------
  #
  # The signing certificate names this workflow file at the ref the run started from, never the
  # commit that was checked out — so a run on `main` signs as `release-cli.yml@refs/heads/main`
  # whatever it built, and what it builds has to be something `main` released. Three checks,
  # before any job builds or holds a write token:
  #
  #   - the run is on `main`: a dispatch, or a release-please run, from any other branch is
  #     refused rather than signed under main's identity;
  #   - the input is exactly `terrace-contract-vX.Y.Z`, so it cannot carry a newline into an output
  #     or name anything but a release tag;
  #   - that tag exists, and its commit is on `main`'s history.
  #
  # The jobs below then check out `refs/tags/<tag>`, never a bare `ref: <tag>`, which lets a
  # branch of the same name win, and fail unless it is still the commit resolved here, since a
  # tag can be moved between this job and the next.
  resolve:
    name: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Refuse any ref but main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::release-cli publishes from refs/heads/main only, not ${REF}."
            exit 1
          fi

      - name: Validate the tag name
        shell: bash
        run: |
          if ! [[ "$TAG" =~ ^terrace-contract-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must match ^terrace-contract-v[0-9]+\.[0-9]+\.[0-9]+\$"
            exit 1
          fi

      # Full history and every tag, so both the tag and `origin/main` are local refs to compare.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve the tag to a commit on main
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if ! sha="$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}")"; then
            echo "::error::refs/tags/${TAG} does not exist."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
            echo "::error::${TAG} (${sha}) is not on main's history."
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------------------------------------------
  # 9.2 — the binaries
  # ----------------------------------------------------------------------------------------------
  build:
    name: build (${{ matrix.target }})
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runners, and the image's first architecture. musl so there is no glibc floor: the
          # binary has to run in a `scratch` image and on whatever a consuming repository's runner
          # happens to be.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            arch: amd64
          # ARM runners, and the image's second architecture. Built *natively*, on an ARM
          # runner, rather than cross-compiled from the amd64 one — and that is not a preference.
          # `cross` runs the compiler inside a container that mounts the crate's workspace root,
          # which here is `cli/`; `validate.rs` embeds `spec/v1/contract.schema.json` from the
          # repository root, a directory that is then not in the container at all, and the build
          # fails at `include_str!`. Mounting the parent as well would make the publish depend on
          # `cross`'s mount layout for the one target nothing else needs a container for, where a
          # runner of the right architecture makes both Linux legs the same three steps.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            arch: arm64
          # The development shell this repository is written from.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # Local.
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The tag by its full name, so no branch of the same name can win, and then held to the
      # commit `resolve` verified, so a tag moved between the two jobs fails here instead of being
      # built. See the note there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Refuse a tag that moved since resolve
        shell: bash
        env:
          RESOLVED: ${{ needs.resolve.outputs.sha }}
        run: |
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$RESOLVED" ]; then
            echo "::error::refs/tags/${TAG} is now ${head}, but resolve verified ${RESOLVED}."
            exit 1
          fi

      # No cache. Everything below is signed and published under a version number a consumer
      # pins, so it is built from source every time: a cache is state another workflow can write,
      # and "the bytes came from a cache somebody else filled" is not something a signature should
      # ever be asserting.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          cache: false

      # Both Linux legs, each for its own architecture: the two musl targets are the only ones
      # here, so the condition is the platform rather than a list of targets to keep in step.
      - name: Install the musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y musl-tools

      # Every target is the host's own architecture now, so there is one command and no host that
      # has to reach another. `--locked` because the lock file is part of what the tag names.
      - name: Build
        working-directory: cli
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"

      # Named for the target, so a consumer's download URL is derivable from `uname` alone.
      # `.tar.gz` everywhere but Windows, which has no `tar` in every shell a recipe might run
      # under. Paths are resolved with `pwd` rather than `$GITHUB_WORKSPACE`: on the Windows runner
      # that variable is a backslash path, and a backslash inside a bash string is an escape.
      - name: Package
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version="${TAG#terrace-contract-v}"
          stem="terrace-contract-${version}-${TARGET}"
          mkdir -p dist
          out="$(cd dist && pwd)"
          release="cli/target/${TARGET}/release"
          if [ "$TARGET" = "x86_64-pc-windows-msvc" ]; then
            (cd "$release" && 7z a -tzip "${out}/${stem}.zip" terrace-contract.exe)
            echo "asset=${stem}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "${out}/${stem}.tar.gz" -C "$release" terrace-contract
            echo "asset=${stem}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      # The bare binary as well, for the two architectures the image is built from — kept separate
      # from the archive so the image build is a `COPY` rather than an unpack.
      - name: Stage the image binary
        if: matrix.arch != ''
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "image/${ARCH}"
          cp "cli/target/${TARGET}/release/terrace-contract" "image/${ARCH}/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-${{ matrix.target }}
          path: dist/${{ steps.package.outputs.asset }}
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.arch != ''
        with:
          name: image-${{ matrix.arch }}
          path: image/${{ matrix.arch }}/terrace-contract
          if-no-files-found: error
          retention-days: 1

  # ----------------------------------------------------------------------------------------------
  # 9.2 — the release, its checksums and their signatures
  # ----------------------------------------------------------------------------------------------
  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: release
      deployment: false
    permissions:
      contents: write # to attach the assets to the release
      id-token: write # for keyless signing and the provenance attestation
      attestations: write # to store the provenance attestation
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: asset-*
          merge-multiple: true
          path: dist

      # One file over all of them, rather than one `.sha256` each. It is what a consumer checks in
      # one command, and it is the file the signature is over — so a tampered archive fails the
      # checksum and a tampered checksum file fails the signature.
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      # SLSA build provenance over the archives and the checksum file, stored with GitHub's
      # attestation API: `gh attestation verify <file> --repo <owner>/terrace-config` then states
      # which workflow run, at which commit, built the bytes — the cosign signature below states
      # who signed them, this states what they were built from.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the certificate records which workflow, in which repository, at which ref produced
      # these bytes, and a verifier pins that identity rather than a key somebody has to hold.
      - name: Sign
        working-directory: dist
        env:
          COSIGN_YES: "true"
        run: |
          # `SHA256SUMS` alone, and that is the whole chain: a tampered archive fails the
          # checksum, and a tampered checksum file fails this signature. Signing each archive
          # as well would be four more files saying what one already says.
          #
          # One bundle rather than a `.sig` and a `.pem`: cosign 3 writes the new bundle format
          # by default, ignores `--output-signature` and `--output-certificate` under it, and
          # fails outright when no `--bundle` path is given.
          cosign sign-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json

      # `--clobber` stays, for the re-run the trigger above documents: a publish that failed after
      # uploading some assets must be able to replace them on the next attempt. What it can
      # overwrite is bounded by `resolve` — only a `main` run, only an existing release tag, and only
      # bytes built from that tag's commit on `main`.
      - name: Attach
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$REPOSITORY"

      # §9.3's composite action lives in another repository, and a consumer of it pins a version
      # there rather than here. What this owes it is a release whose asset names are derivable —
      # `terrace-contract-<version>-<target>.<ext>` beside one `SHA256SUMS` and its signature —
      # which is what the step above just attached, and what the summary below states so that a
      # person writing an installer does not have to open the release page to learn the shape.
      - name: Say what a consumer can now pin
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          version="${TAG#terrace-contract-v}"
          {
            echo "### terrace-contract ${version}"
            echo
            echo '| asset | verify |'
            echo '|---|---|'
            for file in dist/*; do
              case "$file" in *.sigstore.json) continue;; esac
              echo "| \`$(basename "$file")\` | \`sha256sum -c SHA256SUMS\` |"
            done
            echo
            echo 'The checksum file is signed keylessly:'
            echo
            echo '```'
            echo "cosign verify-blob SHA256SUMS \\"
            echo "  --bundle SHA256SUMS.sigstore.json \\"
            echo "  --certificate-identity 'https://github.com/${REPOSITORY}/.github/workflows/release-cli.yml@refs/heads/main' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------------------------------------------
  # 9.1 — the container image
  # ----------------------------------------------------------------------------------------------
  image:
    name: image
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
      packages: write # to push to the registry
      id-token: write # for keyless signing
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The tag by its full name, so no branch of the same name can win, and then held to the
      # commit `resolve` verified, so a tag moved between the two jobs fails here instead of being
      # built. See the note there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Refuse a tag that moved since resolve
        shell: bash
        env:
          RESOLVED: ${{ needs.resolve.outputs.sha }}
        run: |
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$RESOLVED" ]; then
            echo "::error::refs/tags/${TAG} is now ${head}, but resolve verified ${RESOLVED}."
            exit 1
          fi

      # Under `cli/dist/<arch>/`, which is where the Dockerfile's `COPY` looks. The path carries
      # buildx's own `TARGETARCH`, so one `COPY` line serves both architectures.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: cli/staged

      - name: Lay the binaries out the way the Dockerfile reads them
        run: |
          for arch in amd64 arm64; do
            mkdir -p "cli/dist/${arch}"
            mv "cli/staged/image-${arch}/terrace-contract" "cli/dist/${arch}/"
            chmod +x "cli/dist/${arch}/terrace-contract"
          done

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # `metadata-action`'s `semver` type parses the value it is handed, and the tag is not one:
      # `terrace-contract-v0.2.1` carries the component prefix release-please puts in front of
      # every tag in this repository, so the parse fails, all three patterns below yield nothing,
      # and the push fails on an image with no tag at all. The version is what the image is tagged
      # with in any case, so the version is what the action is handed.
      - name: Version
        id: version
        run: echo "version=${TAG#terrace-contract-v}" >> "$GITHUB_OUTPUT"

      # `1`, `0.1` and `0.1.0`: a consumer pins the precision it wants, and a Dockerfile pinning
      # the major gets every fix without an edit. That is the whole point of the image channel.
      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/terrace-contract
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: cli
          file: cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The digest, not a tag: a tag moves and a signature over one says nothing about the bytes a
      # consumer pulled. This is the same argument the contract refresh makes about vendoring.
      #
      # Lowercased because a reference must be, and `repository_owner` is not: `metadata-action`
      # lowercases the name it pushes under, so the raw owner names a repository that does not
      # exist and cosign refuses to parse it.
      - name: Sign
        env:
          COSIGN_YES: "true"
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/terrace-contract
        run: cosign sign "${IMAGE,,}@${DIGEST}"
