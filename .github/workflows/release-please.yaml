name: release-please

# Release automation. `release-please` maintains a single release pull request against `main`,
# accumulating every conventional commit since the last tag; merging it writes `CHANGELOG.md`,
# bumps `Cargo.toml`/`Cargo.lock`, tags the repository and publishes the GitHub release.
#
# Two packages, and they are released differently on purpose.
#
# `terrace-config` — the root — publishes nothing: it sets `publish = false` and is consumed as a
# tagged git dependency, so the tag *is* the artefact. Its tags are `v<version>`, unchanged.
#
# `terrace-contract` — `cli/` — is a tool rather than a library, and what a consuming build wants
# is a binary or an image: no toolchain, no compile, no platform detection. Its tags carry the
# component (`terrace-contract-v<version>`) so the two packages cannot collide, and that tag is
# what `release-cli.yml` is keyed on — it cross-compiles the four targets §9.2 names, signs them
# and their checksums keylessly, and builds the multi-architecture image from those same bytes.
# Nothing goes to crates.io from either.
#
# The version the README advertises is not maintained here. `docs.yml` re-renders
# `.github/templates/README.md.hbs` on every pull request from the version in `Cargo.toml`, so
# the release pull request — which is the commit that changes that version — carries the updated
# `README.md` with it, rather than leaving the install snippet pointing at the previous tag.

on:
  push:
    branches: [main]
  workflow_dispatch:

# A release must never be cancelled halfway: the tag, the release and the changelog commit are
# three separate API calls, and a cancellation between them leaves a state no rerun can infer.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release Please
    environment:
      name: release
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to create the release commit, the tag and the GitHub release
      issues: write # to comment on the issues a release closes
      pull-requests: write # to open and maintain the release pull request
    # Per package, because `release-please` namespaces its outputs by path once a manifest names
    # more than one. The `cli` pair is what the publish job below is gated on; the root pair is
    # declared beside it so that a job which needs it later does not have to guess the spelling.
    outputs:
      root_released: ${{ steps.release.outputs['.--release_created'] }}
      root_tag: ${{ steps.release.outputs['.--tag_name'] }}
      cli_released: ${{ steps.release.outputs['cli--release_created'] }}
      cli_tag: ${{ steps.release.outputs['cli--tag_name'] }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # An App installation token, not `GITHUB_TOKEN`. Commits pushed with the default token do
      # not trigger workflows, which would leave the release pull request without the `ci` check
      # it has to pass and without the README render described above.
      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write # release commit, tag and GitHub release
          permission-pull-requests: write # open and maintain the release pull request

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.generate_token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ------------------------------------------------------------------------------------------
  # Publishing what was just tagged
  # ------------------------------------------------------------------------------------------
  #
  # A called workflow rather than one the tag triggers, and the difference is what "released"
  # means. Called, the release either happened or it did not: the tag, the assets, the image and
  # their signatures are one run, and a failure anywhere in it is one red run to re-run. Triggered
  # separately, tagging can succeed while publishing fails — leaving a version that exists, that
  # `helm-charts` will happily pin, and that nobody can install.
  #
  # Gated on `cli_released` rather than run every time: most merges to `main` produce no release at
  # all, and a publish job that started on each of them would spend four cross-compiles to discover
  # there is nothing to publish.
  #
  # The root package has no equivalent job and needs none — it is a library consumed as a tagged
  # git dependency, so its tag *is* its artefact.
  publish-cli:
    name: Publish terrace-contract
    needs: release-please
    if: needs.release-please.outputs.cli_released == 'true'
    permissions:
      contents: write # to attach the assets to the release it just created
      packages: write # to push the image
      id-token: write # for keyless signing of both
    uses: ./.github/workflows/release-cli.yml
    with:
      tag: ${{ needs.release-please.outputs.cli_tag }}
