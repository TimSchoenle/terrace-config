name: security

# Static analysis of the workflows themselves: the one body of code in this repository with
# write access to it, and the one nothing else checks. Catches unpinned actions, over-broad
# `permissions`, credentials persisted into `.git/config`, and `${{ }}` interpolated into a
# `run:` block, which is a shell injection rather than a template.
#
# jactionlint keeps every check of actionlint and has a rule for every zizmor audit. The
# `pedantic` profile on purpose: the default reports only what is provably exploitable today,
# pedantic reports the shape that becomes exploitable after one careless edit. It runs online, so
# it also asks GitHub about the actions in use (impostor commits, vulnerable versions, moved tags,
# archived repositories), and strict-exit fails it on findings of every level.
# .github/jactionlint.yaml holds the turned-off rules and accepted findings, and the SARIF goes to
# code scanning under the category jactionlint.
#
# Dependency advisories are not here. `cargo deny check` in ci.yml already covers them against
# the committed `Cargo.lock`, and ci.yml runs on the same weekly schedule so an advisory
# published against an unchanged tree is still caught. Two gates reading two configurations for
# one advisory database is how they end up disagreeing.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, alongside CI's scheduled run: advisories published since the last change are reported.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action-lint:
    name: Action Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to check out the workflows
      security-events: write # to upload the SARIF findings to code scanning
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run jactionlint
        uses: TimSchoenle/actions/actions/security/jactionlint@0701d3b35ad7e10e3159471c82f4743b67fdc01f # tag=actions-security-jactionlint-v1.1.3
        with:
          online: 'true'
          strict-exit: 'true'
