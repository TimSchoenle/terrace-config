name: update-files

# Keeps the committed lockfiles in step with the manifests that produce them, and commits the
# result to the pull request rather than failing it.
on:
  pull_request:

# A newer push supersedes the run on the older head. Nothing here writes to the branch: the
# commit happens in update-files-commit.yaml, which queues with the other writers to this branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# Two halves, and the split is the security boundary of this workflow.
#
# `lockfiles` resolves the dependency graph with the toolchain `rust-toolchain.toml` names, and
# both of those are the pull request's to choose. It holds no secret and a read-only
# `GITHUB_TOKEN`, and hands on only a patch artifact.
#
# `lockfiles-commit` in update-files-commit.yaml (a workflow_run workflow the pull request cannot
# edit) holds the maintenance App's private key and the write token minted from it, and runs nothing
# from the checkout: it commits that patch, and `allowed_paths` refuses any path other than the two
# lockfiles. Were both halves one job, anything the first ran could read the key out of the runner
# or leave a process behind to collect the token once it was minted.
jobs:
  lockfiles:
    name: lockfiles
    # A fork's branch is not in this repository, so there would be nothing to commit to.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # The pull request head, not the default merge commit: the patch is committed to the branch,
      # so it has to be computed against the commit the branch points at, and that is the commit
      # `commit-patch` checks it against.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      # Both from the repository root. `fuzz/rust-toolchain.toml` pins nightly for anyone working
      # *inside* that directory, but rustup selects on the working directory rather than on
      # `--manifest-path`, so resolution here runs on the root pin, which is all dependency
      # resolution needs, and one toolchain fewer to install.
      - name: Resolve both lockfiles
        run: |
          cargo fetch --manifest-path rust/Cargo.toml
          cargo fetch --manifest-path rust/fuzz/Cargo.toml

      - name: Create Patch
        id: patch
        uses: TimSchoenle/actions/actions/common/create-patch@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-create-patch-v1.1.1
        with:
          artifact_name: update-files-lockfiles
          paths: 'rust/Cargo.lock rust/fuzz/Cargo.lock'
