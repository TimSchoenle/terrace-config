name: update-files

# Keeps the committed lockfiles in step with the manifests that produce them, and commits the
# result to the pull request rather than failing it.
on:
  pull_request:

# Shared with docs.yml. See the note there: both workflows commit to the pull request branch,
# and serialising them is what keeps the second one from failing on a moved parent.
concurrency:
  group: branch-writes-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  lockfiles:
    name: lockfiles
    # Forks get no secrets, so there would be no token to commit with.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # the write happens with the App token below, not with GITHUB_TOKEN
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      # Both from the repository root. `fuzz/rust-toolchain.toml` pins nightly for anyone working
      # *inside* that directory, but rustup selects on the working directory rather than on
      # `--manifest-path`, so resolution here runs on the root pin — which is all dependency
      # resolution needs, and one toolchain fewer to install.
      - name: Resolve both lockfiles
        run: |
          cargo fetch --manifest-path rust/Cargo.toml
          cargo fetch --manifest-path rust/fuzz/Cargo.toml

      - name: Commit and push if changed
        id: auto-commit
        uses: TimSchoenle/actions/actions/common/commit-changes@eaf935674fec7116856ca5e138e1a2dca3f8146d # tag=actions-common-commit-changes-v1.5.8
        with:
          commit_message: 'build: update lockfiles'
          file_pattern: 'rust/Cargo.lock rust/fuzz/Cargo.lock'
          token: ${{ steps.generate_token.outputs.token }}
