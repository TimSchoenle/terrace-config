# The shared toolchain: everything the configuration contract needs *after* a document exists.
#
# Its own workspace, and a sibling of the Rust implementation rather than a member of it. That is
# the architectural claim in one file: the binary is not part of the Rust implementation, it is
# *written in* Rust. A crate nested under the implementation would be read as that implementation's
# tool by everyone who did not read `docs/contract-cli-plan.md`, and the Java side would be right
# to treat it that way.
#
# The separate workspace follows `fuzz/`'s reasoning: entirely different dependency weight,
# entirely different audience, and no reason for one lock file to arbitrate between a library that
# must stay light enough for a service to link and a binary that carries an argument parser and a
# JSON Schema engine.
#
# **It must not depend on `terrace-config`.** Not as a path dependency, not transitively. Every
# rendering here is a pure function of the published document, which is what makes it a renderer
# for the Java producer and for producers that do not exist yet. CI asserts the absence.
[workspace]
members = []

[package]
name = "terrace-contract"
version = "0.2.0"
edition = "2024"
authors = ["Tim Schönle"]
license = "MIT"
description = "Read, render, check and gate configuration contracts, in any producer's language."
repository = "https://github.com/TimSchoenle/terrace-config"
keywords = ["configuration", "contract", "kubernetes", "helm", "cli"]
categories = ["command-line-utilities", "config"]
rust-version = "1.94"
# Distributed as release binaries and a container image rather than through crates.io, which is
# what a consuming build actually wants: no toolchain, no compile, no platform detection. The name
# stays reserved.
publish = false

[features]
default = ["cli"]
# The features stack, and the arrow points one way: `cli` -> `helm` -> `k8s` -> the core. The
# producer-side half is what is left with `--no-default-features`, and keeping it compiling is the
# mechanical check that no consumer-side concept — a chart, a manifest, a Helm marker — has leaked
# down into the document model, the renderers or the value checks. A language's build links that
# half and nothing above it.
cli = ["dep:clap", "helm", "oci"]
# A chart repository's own conventions: `config-contract.yaml`, the vendored contracts, the values
# tree. They arrive in a repository that publishes a language-neutral format, and this is what keeps
# that from being a mistake — every one of them sits above `k8s`, so nothing below can read them.
helm = ["k8s", "dep:saphyr-parser"]
# Rendered Kubernetes manifests. Knows what a workload is and not what a chart is.
k8s = ["dep:serde_norway"]
# Talking to a container registry, which exactly one subcommand does. Split out rather than folded
# into `helm` because it is the only thing here that carries an archive reader and a hash
# implementation, and a library consumer taking the gates should not link either.
oci = ["helm", "dep:sha2", "dep:flate2", "dep:tar"]

[[bin]]
name = "terrace-contract"
path = "src/bin/main.rs"
required-features = ["cli"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# Deliberately *without* `preserve_order`. A producer builds its JSON with `serde_json::Map`, which
# is a `BTreeMap`, so every object in a published document is already alphabetical — the `properties`
# of a JSON Schema included, which is why they do not follow declaration order. Sorting the same way
# is what makes `--format contract` a byte-for-byte round trip and `--format json-schema` reproduce
# the corpus; preserving insertion order instead would differ from every document ever published.
serde_json = "1"
thiserror = "2"
# A real dependency, not a dev one: `validate` holds any producer's document to the published
# meta-schema, which is the first question a new implementation asks. Default features off keeps
# `reqwest` and a TLS stack out of a validator whose job includes *refusing* a remote `$ref`
# rather than fetching one.
jsonschema = { version = "=0.55.0", default-features = false }
clap = { version = "4", features = ["derive", "env"], optional = true }
# Ignore patterns are a trailing `*` and nothing more, but a `constraint`'s `pattern` is whatever
# JSON Schema keyword the producer published, so one real engine is needed for the value checks.
regex = "1"
# The typed half of the YAML question. `serde_yaml` is unmaintained and `deny.toml` would say so;
# this is the maintained fork with the same `serde` surface, and it reads a multi-document rendered
# file, a chart's values and a declaration. The *other* half — a scanner with line and column, for
# the `@config` markers that live inside comments — is a separate decision and a later phase, because
# no crate here preserves a comment and the marker language is the only thing that needs one.
serde_norway = { version = "0.9", optional = true }
# The marker half of the YAML question, and not the half it was posed as. No Rust crate preserves
# comments — `saphyr`, `yaml-rust2` and `marked-yaml` all discard them — and a `@config` marker *is*
# a comment, so the comment scan is line-keyed whatever is linked. What this earns is the other
# half: every event carries a span, so a value's dotted path comes from the document's own
# structure rather than from indentation. That removes both exceptions a line reader needs, since a
# `port: 1` inside a block scalar is one scalar event and not a mapping key.
saphyr-parser = { version = "0.0.12", optional = true }
# A real dependency now rather than only a dev one. It was here so that the TOML rendering's claim —
# that the file it writes *loads* — was held by something that actually parses it; it is here as
# well because a rendered configuration document is usually TOML and gate 1 has to read one, and
# because a `structured` value is a TOML literal that the loader's own read parses. Pinned exactly,
# as `main` pinned it: the version suffix names the TOML specification it implements, and a document
# gate that silently moved between specifications would change what it accepts.
toml = "=0.9.12+spec-1.1.0"
# Refreshing a vendored contract, and nothing else. The blob a registry hands back is checked
# against the digest its descriptor claims, and the embedded carrier is a file inside a layer — so
# a hash and an archive reader are what reading one honestly costs.
sha2 = { version = "0.11", optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }

[dev-dependencies]
# The parity harness writes a mutant of a rendered tree back out as YAML, so that both
# implementations read the same broken bytes rather than each mutating its own copy. Only the test
# target needs to *write* YAML; the crate itself only ever reads it.
serde_norway = "=0.9.42"


[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
multiple_crate_versions = "allow"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
too_long_first_doc_paragraph = "warn"
must_use_candidate = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
unescaped_backticks = "warn"
