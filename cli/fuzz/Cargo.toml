# A workspace of its own, for the reason `../../fuzz` gives: `libfuzzer-sys` compiles the crate
# under test with `-Z sanitizer=address`, which is nightly-only, and as a member it would drag
# nightly into `cargo fmt` and `cargo clippy` for the whole toolchain.
[workspace]

[package]
name = "terrace-contract-fuzz"
version = "0.0.0"
edition = "2024"
authors = ["Tim Schönle"]
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

# The oracles live in a library, not in the target binaries — the same decision the loader's fuzz
# crate made, for the same reason. `cargo fuzz` needs a nightly sanitizer, and on Windows an
# AddressSanitizer runtime that ships with Visual Studio rather than with rustup; an oracle that
# only runs under that toolchain is an oracle nobody checks. With the bodies here,
# `tests/seeds.rs` replays the whole committed corpus on a plain `cargo test`, anywhere, and the
# fuzzer's job is to find new inputs to add to it.
[lib]
name = "terrace_contract_fuzz"
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
terrace-contract = { path = "..", default-features = false }
serde_json = "1"
# The TOML oracle's central claim is that the rendered example *loads*. Asserting that needs a
# parser, not a golden file.
toml = "0.9"

# `-Z sanitizer=address` instruments the crate under test, so the fuzz binary must be built with
# debug assertions on: an arithmetic overflow that panics is a finding, and one that silently
# wraps is not.
[profile.release]
debug = true
debug-assertions = true
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
# `cargo fuzz` sets `--cfg fuzzing` through RUSTFLAGS, so cargo cannot see it declared anywhere and
# `unexpected_cfgs` would fire on every target shim.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
missing_docs = "warn"

# The same set as the crate under test. An oracle is the thing deciding whether a finding is real,
# so it is the last place to accept sloppiness.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
too_long_first_doc_paragraph = "warn"
must_use_candidate = "allow"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
unescaped_backticks = "warn"

# `test`/`doc`/`bench = false`: a `fuzz_target!` binary has no `main` a test harness can call, and
# `cargo test` in here would fail to link it before reaching the replay suite.

[[bin]]
name = "document"
path = "fuzz_targets/document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "render"
path = "fuzz_targets/render.rs"
test = false
doc = false
bench = false

[[bin]]
name = "conform"
path = "fuzz_targets/conform.rs"
test = false
doc = false
bench = false
