# Configuration for a service reading LIMITER_-prefixed keys.
#
# Generated from the configuration type, so it lists every key that type can carry and nothing
# else. Each key shows the value it already has, commented out: a commented key and a deleted key
# mean the same thing to the loader, so uncomment one only to change it. A key that is not
# commented out has no default, and nothing loads until something supplies it.
#
# Three layers can supply any key below, and all three win over this file: the environment
# variable named above the key, a file named by that variable plus `_FILE`, and a key-named file
# in the secrets directory. A secret belongs in one of those — this file is usually committed.
#
# Read before this file exists:
#
#   LIMITER_CONFIG — config, default `config.toml`
#     Names the TOML layer: a file, or a directory whose `*.toml` files are all merged in name
#     order.
#
#   LIMITER_SECRETS_DIR — secrets dir
#     Names a directory of key-named files — a mounted Kubernetes `Secret` volume. Each file
#     supplies the key its name spells.

[global]
# Requests allowed per minute, which is the bucket's refill rate.
# Type: u32
# Also from: LIMITER_GLOBAL__PER_MINUTE, LIMITER_GLOBAL__PER_MINUTE_FILE=/path/to/file,
#   global__per_minute in the secrets directory
# per_minute = 300

# The most requests a client may spend back-to-back.
# Type: u32
# Also from: LIMITER_GLOBAL__BURST, LIMITER_GLOBAL__BURST_FILE=/path/to/file, global__burst in the
#   secrets directory
# burst = 60

[auth]
# Requests allowed per minute, which is the bucket's refill rate.
# Type: u32
# Also from: LIMITER_AUTH__PER_MINUTE, LIMITER_AUTH__PER_MINUTE_FILE=/path/to/file,
#   auth__per_minute in the secrets directory
# Unset by default: the value below is only the shape.
# per_minute = 0

# The most requests a client may spend back-to-back.
# Type: u32
# Also from: LIMITER_AUTH__BURST, LIMITER_AUTH__BURST_FILE=/path/to/file, auth__burst in the
#   secrets directory
# Unset by default: the value below is only the shape.
# burst = 0

[store]
# Connection URL of the counter store.
# Type: String
# Also from: LIMITER_STORE__URL, LIMITER_STORE__URL_FILE=/path/to/file, store__url in the secrets
#   directory
# Required: nothing loads until this key is supplied.
url = "<value>"
